<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Arena Utils</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <header>
        <strong>Arena Utils</strong>
        <span id="status" data-i18n="popupStatusChecking">Checking page…</span>
    </header>

    <label class="check">
        <input id="autoscroll" type="checkbox" />
        <span data-i18n="popupAutoscrollLabel">Disable autoscroll after AI replies</span>
    </label>

    <label class="check">
        <input id="collapse-code" type="checkbox" />
        <span data-i18n="popupCollapseCodeLabel">Collapse code blocks in AI replies</span>
    </label>

    <section id="article-section">
        <div class="row">
            <h2 data-i18n="popupArticleTitle">Article</h2>
        </div>
        <p id="article-meta" class="meta" data-i18n="popupArticleChecking">Checking page…</p>
        <button id="explain-article" type="button" disabled data-i18n="popupArticleButton">Explain article</button>
    </section>

    <section id="video-section" hidden>
        <div class="row">
            <h2 data-i18n="popupVideoTitle">Video</h2>
        </div>
        <p id="video-meta" class="meta" data-i18n="popupVideoChecking">Checking video…</p>
        <button id="explain-video" type="button" disabled data-i18n="popupVideoButton">Explain video</button>
    </section>

    <button id="export" type="button" data-i18n="popupExportButton">Export chat</button>

    <section id="new-chat-section" hidden>
        <div class="row">
            <h2 id="new-chat-title" data-i18n="popupNewChatTitle">New chat</h2>
            <a id="new-chat-edit" href="options.html#chat-templates" target="_blank" rel="noreferrer"
                data-i18n="popupNewChatEdit">Edit</a>
        </div>
        <div id="new-chat-templates" class="prompts"></div>
    </section>

    <section>
        <div class="row">
            <h2 data-i18n="popupBookmarksTitle">Bookmarks</h2>
            <span id="bookmarks-count" class="muted"></span>
        </div>
        <div id="bookmarks" class="prompts"></div>
    </section>

    <section id="debug-section">
        <div class="row">
            <h2 data-i18n="popupDebugTitle">Debug</h2>
        </div>
        <label class="check">
            <input id="perf-debug" type="checkbox" />
            <span data-i18n="popupPerfEnable">Enable performance profiling</span>
        </label>
        <div class="row" style="margin-top: 8px; gap: 6px;">
            <button id="perf-dump" type="button" style="flex: 1;" data-i18n="popupPerfDumpButton">Dump report</button>
            <button id="perf-reset" type="button" style="flex: 1;" data-i18n="popupPerfResetButton">Reset</button>
        </div>
    </section>

    <script src="i18n.js"></script>
    <script src="shared.js"></script>
    <script src="chatTemplates.js"></script>
    <script src="popup.js"></script>
</body>

</html>
