<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Arena Utils</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <header>
        <strong>Arena Utils</strong>
        <span id="status">Checking page…</span>
    </header>

    <label class="check">
        <input id="autoscroll" type="checkbox" />
        <span>Disable autoscroll after AI replies</span>
    </label>

    <label class="check">
        <input id="collapse-code" type="checkbox" />
        <span>Collapse code blocks in AI replies</span>
    </label>

    <section id="article-section">
        <div class="row">
            <h2>Article</h2>
        </div>
        <p id="article-meta" class="meta">Checking page…</p>
        <button id="explain-article" type="button" disabled>Explain article</button>
    </section>

    <section id="video-section" hidden>
        <div class="row">
            <h2>Video</h2>
        </div>
        <p id="video-meta" class="meta">Checking video…</p>
        <button id="explain-video" type="button" disabled>Explain video</button>
    </section>

    <button id="export" type="button">Export chat</button>

    <section id="new-chat-section" hidden>
        <div class="row">
            <h2 id="new-chat-title">New chat</h2>
            <a id="new-chat-edit" href="options.html#chat-templates" target="_blank" rel="noreferrer">Edit</a>
        </div>
        <div id="new-chat-templates" class="prompts"></div>
    </section>

    <section>
        <div class="row">
            <h2>Bookmarks</h2>
            <span id="bookmarks-count" class="muted"></span>
        </div>
        <div id="bookmarks" class="prompts"></div>
    </section>

    <section>
        <div class="row">
            <h2>Codebase</h2>
            <a href="options.html#codebase" target="_blank" rel="noreferrer">Settings</a>
        </div>
        <p id="codebase-meta" class="meta"></p>
        <button id="pick-folder" type="button">Select folder…</button>
        <div id="codebase" class="prompts"></div>
    </section>


    <section id="debug-section">
        <div class="row">
            <h2>Debug</h2>
        </div>
        <label class="check">
            <input id="perf-debug" type="checkbox" />
            <span>Enable performance profiling</span>
        </label>
        <div class="row" style="margin-top: 8px; gap: 6px;">
            <button id="perf-dump" type="button" style="flex: 1;">Dump report</button>
            <button id="perf-reset" type="button" style="flex: 1;">Reset</button>
        </div>
    </section>

    <script src="shared.js"></script>
    <script src="chatTemplates.js"></script>
    <script src="popup.js"></script>
</body>

</html>
